<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Tập Trực Tuyến - E-Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Hiệu ứng nhấp nháy cho bài đang mở */
        .pulse-ring { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- HEADER GIAO DIỆN -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 w-10 h-10 flex items-center justify-center rounded-lg text-xl shadow-inner">
                    <i class="fas fa-graduation-cap text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide uppercase text-amber-400">E-Academy</h1>
                    <p class="text-xs text-slate-400 font-medium">Học Chủ Động - Bứt Phá Điểm Số</p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <span class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300">
                    <i class="fas fa-user-circle mr-1"></i> Không gian học tập THCS & THPT
                </span>
            </div>
        </div>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        
        <!-- Tabs Bộ lọc -->
        <div class="flex space-x-2 mb-8 overflow-x-auto pb-2" id="filter-tabs">
            <button class="px-5 py-2 rounded-full bg-slate-800 text-white text-sm font-semibold shadow">Tất cả</button>
            <button class="px-5 py-2 rounded-full bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 text-sm font-semibold transition">Toán Lớp 6</button>
            <button class="px-5 py-2 rounded-full bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 text-sm font-semibold transition">Toán Lớp 7</button>
            <button class="px-5 py-2 rounded-full bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 text-sm font-semibold transition">Toán Lớp 10</button>
        </div>

        <div id="lessons-container" class="space-y-4">
            <!-- Dữ liệu sẽ được Javascript đổ vào đây tự động -->
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
        <p>&copy; 2026 Hệ thống quản lý học tập trực tuyến E-Academy. Bản quyền thuộc ThS.Đinh Quốc Tuấn.</p>
    </footer>

    <!-- SCRIPT TINH GỌN GIAO DIỆN TỰ ĐỘNG -->
    <script>
        // 1. Cấu trúc dữ liệu mô phỏng (Sau này thầy lấy từ Google Sheets api.js bỏ vào đây)
        const lessonsData = [
            {
                id: "toan6-04",
                grade: "Toán 6",
                title: "Thứ tự thực hiện phép tính",
                desc: "Quy tắc thực hiện phép tính, biểu thức có ngoặc và không có ngoặc.",
                isOpen: true
            },
            {
                id: "toan6-05",
                grade: "Toán 6",
                title: "Quan hệ chia hết và dấu hiệu chia hết",
                desc: "Tìm hiểu các dấu hiệu chia hết cho 2, 3, 5, 9 và tính chất chia hết của một tổng.",
                isOpen: true
            },
            {
                id: "toan7-01",
                grade: "Toán 7",
                title: "Tập hợp các số hữu tỉ",
                desc: "Khái niệm số hữu tỉ, biểu diễn trên trục số và so sánh hai số hữu tỉ.",
                isOpen: false
            },
            {
                id: "toan10-02",
                grade: "Toán 10",
                title: "Tập hợp và các phép toán",
                desc: "Giao, hợp, hiệu của hai tập hợp. Biểu diễn bằng biểu đồ Ven.",
                isOpen: true
            }
        ];

        // 2. Thuật toán Render giao diện dạng "Thẻ thông minh"
        function renderLessons() {
            const container = document.getElementById("lessons-container");
            container.innerHTML = "";

            lessonsData.forEach(lesson => {
                const card = document.createElement("div");
                
                // Nếu bài đang khóa thì làm mờ
                const opacityClass = lesson.isOpen ? "opacity-100" : "opacity-60 grayscale-[30%] pointer-events-none";
                const statusDot = lesson.isOpen 
                    ? `<span class="relative flex h-2.5 w-2.5 mr-2"><span class="pulse-ring absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span></span>`
                    : `<span class="relative flex h-2.5 w-2.5 mr-2"><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-slate-300"></span></span>`;

                card.className = `bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col md:flex-row md:items-center justify-between gap-4 ${opacityClass}`;

                card.innerHTML = `
                    <!-- Phân trái: Thông tin bài học -->
                    <div class="flex-grow">
                        <div class="flex items-center mb-1">
                            ${statusDot}
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 mr-2">${lesson.id}</span>
                            <span class="text-xs font-semibold text-amber-600">${lesson.grade}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-800 leading-tight">${lesson.title}</h3>
                        <p class="text-xs text-slate-500 mt-1 line-clamp-1">${lesson.desc}</p>
                    </div>

                    <!-- Phần phải: 3 Nút tác vụ tinh gọn -->
                    <div class="flex flex-wrap md:flex-nowrap gap-2 md:w-auto w-full border-t md:border-t-0 pt-3 md:pt-0 border-slate-100">
                        
                        <!-- Nút Lý Thuyết -->
                        <button onclick="openDocument('${lesson.id}', 'lythuyet')" class="flex-1 md:flex-none flex items-center justify-center space-x-1.5 px-3 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-lg text-xs font-semibold transition">
                            <i class="fas fa-book-open"></i> <span>Lý thuyết</span>
                        </button>

                        <!-- Nút Bài Tập -->
                        <button onclick="openDocument('${lesson.id}', 'baitap')" class="flex-1 md:flex-none flex items-center justify-center space-x-1.5 px-3 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-semibold transition">
                            <i class="fas fa-edit"></i> <span>Bài tập</span>
                        </button>

                        <!-- Nút Trắc Nghiệm Online (Dẫn ra ngoài) -->
                        <a href="https://tuan-23880095.github.io/TracNghiemOnline/?id=${lesson.id}" target="_blank" class="w-full md:w-auto flex items-center justify-center space-x-1.5 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white shadow-sm rounded-lg text-xs font-semibold transition group">
                            <i class="fas fa-stopwatch text-amber-400"></i> 
                            <span>Trắc nghiệm</span>
                            <i class="fas fa-external-link-alt text-[9px] text-slate-400 group-hover:text-white ml-1"></i>
                        </a>

                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Hàm xử lý mở tài liệu (Thầy có thể kết nối với Modal cũ ở đây)
        function openDocument(lessonId, type) {
            // Thay vì mở file vật lý, sau này thầy có thể mở Modal iframe
            const url = `data/${lessonId}-${type}.html`;
            alert(`Sẽ mở Modal nạp nội dung từ: ${url}`);
        }

        // Chạy hàm khi tải trang
        document.addEventListener('DOMContentLoaded', renderLessons);

    </script>
</body>
</html>
